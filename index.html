                      <p className="text-xs text-slate-400 mb-3">
                        Agent installed ➔ Sending data to Splunk instance
                      </p>
                      <div className="text-xs text-emerald-400 font-medium">
                        4 fuentes de logs conectadas →
                      </div>
                    </button>

                    {/* Indexer Card */}
                    <button
                      onClick={() => setSelectedNode('indexer')}
                      className={`text-left p-5 rounded-2xl border transition relative overflow-hidden ${
                        selectedNode === 'indexer'
                          ? 'bg-amber-950/30 border-amber-500 ring-2 ring-amber-500/30'
                          : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono uppercase px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">
                          Paso 2 • Main Role
                        </span>
                        <span className="text-lg">⚙️</span>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-1">Indexer</h3>
                      <p className="text-xs text-slate-400 mb-3">
                        Parses • Normalizes • Categorizes • Store
                      </p>
                      <div className="text-xs text-amber-400 font-medium">
                        Ver las 4 fases de procesamiento →
                      </div>
                    </button>

                    {/* Search Head Card */}
                    <button
                      onClick={() => setSelectedNode('searchhead')}
                      className={`text-left p-5 rounded-2xl border transition relative overflow-hidden ${
                        selectedNode === 'searchhead'
                          ? 'bg-sky-950/30 border-sky-500 ring-2 ring-sky-500/30'
                          : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono uppercase px-2 py-0.5 rounded bg-sky-500/20 text-sky-300">
                          Paso 3 • Consulta
                        </span>
                        <span className="text-lg">📊</span>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-1">Search Head</h3>
                      <p className="text-xs text-slate-400 mb-3">
                        Search & Report App • SPL • Dashboards & Tables
                      </p>
                      <div className="text-xs text-sky-400 font-medium">
                        Explorar SPL y Visualización →
                      </div>
                    </button>
                  </div>

                  {/* Detailed Node Panel */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    {selectedNode === 'forwarder' && (
                      <div className="space-y-6">
                        <div className="border-b border-slate-800 pb-4">
                          <span className="text-xs font-mono text-emerald-400 uppercase">
                            Componente 1 de tus apuntes
                          </span>
                          <h3 className="text-2xl font-bold text-white mt-1">
                            {ARCH_NODES.forwarder.title}
                          </h3>
                          <div className="mt-3 flex flex-wrap gap-2">
                            {ARCH_NODES.forwarder.notebookNotes.map((note, i) => (
                              <span
                                key={i}
                                className="text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 px-3 py-1 rounded-lg font-mono"
                              >
                                ✏️ "{note}"
                              </span>
                            ))}
                          </div>
                        </div>

                        <div>
                          <h4 className="text-sm font-semibold text-slate-200 mb-3">
                            Fuentes de Datos (Logs enviados por el Forwarder):
                          </h4>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {ARCH_NODES.forwarder.sources.map((src, idx) => (
                              <div
                                key={idx}
                                className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2"
                              >
                                <div className="flex items-center justify-between">
                                  <span className="font-bold text-emerald-400 text-sm">
                                    • {src.name}{' '}
                                    <span className="text-slate-400 font-normal">{src.detail}</span>
                                  </span>
                                </div>
                                <p className="text-xs text-slate-300">{src.explanation}</p>
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 font-mono text-[11px] text-slate-300 overflow-x-auto">
                                  {src.example}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {selectedNode === 'indexer' && (
                      <div className="space-y-6">
                        <div className="border-b border-slate-800 pb-4">
                          <span className="text-xs font-mono text-amber-400 uppercase">
                            Componente 2 de tus apuntes • Main Role
                          </span>
                          <h3 className="text-2xl font-bold text-white mt-1">
                            {ARCH_NODES.indexer.title}
                          </h3>
                          <p className="text-xs text-slate-400 mt-1">
                            Cuando el Forwarder envía los datos, el Indexer cumple su rol principal en 4 etapas exactas:
                          </p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                          {ARCH_NODES.indexer.steps.map((item, idx) => (
                            <div
                              key={idx}
                              className="bg-slate-950 border border-amber-500/20 rounded-xl p-4 flex flex-col justify-between"
                            >
                              <div>
                                <div className="text-xs font-mono text-amber-400 mb-1">
                                  Fase 0{idx + 1}
                                </div>
                                <h4 className="text-lg font-bold text-white mb-2">• {item.step}</h4>
                                <p className="text-xs text-slate-300 leading-relaxed">{item.desc}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {selectedNode === 'searchhead' && (
                      <div className="space-y-6">
                        <div className="border-b border-slate-800 pb-4">
                          <span className="text-xs font-mono text-sky-400 uppercase">
                            Componente 3 de tus apuntes
                          </span>
                          <h3 className="text-2xl font-bold text-white mt-1">
                            {ARCH_NODES.searchhead.title}
                          </h3>
                          <p className="text-xs text-slate-400 mt-1">
                            Es el cerebro analítico donde el usuario interactúa con los datos indexados mediante SPL.
                          </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {ARCH_NODES.searchhead.capabilities.map((cap, idx) => (
                            <div
                              key={idx}
                              className="bg-slate-950 border border-sky-500/20 rounded-xl p-4"
                            >
                              <h4 className="text-base font-bold text-sky-400 mb-1">
                                • {cap.name}
                              </h4>
                              <p className="text-xs text-slate-300 leading-relaxed">{cap.desc}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </section>
              </div>
            )}

            {/* TAB 2: SIMULADOR DE PIPELINE & SPL */}
            {activeTab === 'sim' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h2 className="text-lg font-bold text-white mb-1">
                    Laboratorio en Vivo: De Log Crudo a Dashboard con SPL
                  </h2>
                  <p className="text-xs text-slate-400 mb-4">
                    Selecciona una de las 4 fuentes de tu cuaderno para ver cómo viaja por el Forwarder, cómo lo transforma el Indexer y cómo lo consulta el Search Head.
                  </p>

                  {/* Source Selector */}
                  <div className="flex flex-wrap gap-2 mb-6">
                    {Object.entries(SIMULATOR_DATA).map(([key, item]) => (
                      <button
                        key={key}
                        onClick={() => {
                          setSimSource(key);
                          setSimQueryIdx(0);
                        }}
                        className={`px-3.5 py-2 rounded-xl text-xs font-semibold transition border ${
                          simSource === key
                            ? 'bg-emerald-500 text-slate-950 border-emerald-400'
                            : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>

                  {/* Step 1 & Step 2 Grid */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
                    {/* Forwarder Raw Log */}
                    <div className="bg-slate-950 border border-emerald-500/30 rounded-xl p-4">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono font-semibold text-emerald-400">
                          1. FORWARDER (Sending raw data)
                        </span>
                        <span className="text-[11px] font-mono text-slate-400">
                          sourcetype={currentSim.sourcetype}
                        </span>
                      </div>
                      <pre className="text-xs font-mono text-slate-200 bg-slate-900 p-3 rounded-lg border border-slate-800 whitespace-pre-wrap break-all">
                        {currentSim.rawLog}
                      </pre>
                    </div>

                    {/* Indexer Parsed/Normalized */}
                    <div className="bg-slate-950 border border-amber-500/30 rounded-xl p-4">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono font-semibold text-amber-400">
                          2. INDEXER (Parses, Normalizes, Categorizes, Store)
                        </span>
                        <span className="text-[11px] font-mono text-slate-400">
                          index={currentSim.index}
                        </span>
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        {Object.entries(currentSim.parsed).map(([k, v]) => (
                          <div
                            key={k}
                            className="bg-slate-900 px-2.5 py-1.5 rounded border border-slate-800"
                          >
                            <span className="text-slate-400 font-mono">{k}: </span>
                            <span className="text-amber-300 font-mono font-medium">{v}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Step 3: Search Head & SPL */}
                  <div className="bg-slate-950 border border-sky-500/30 rounded-xl p-5 space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="text-xs font-mono font-semibold text-sky-400">
                        3. SEARCH HEAD • Search and Report App (SPL)
                      </span>
                      <div className="flex gap-2">
                        {currentSim.splQueries.map((q, idx) => (
                          <button
                            key={idx}
                            onClick={() => setSimQueryIdx(idx)}
                            className={`text-xs px-3 py-1 rounded-lg border transition ${
                              simQueryIdx === idx
                                ? 'bg-sky-500 text-slate-950 font-semibold border-sky-400'
                                : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {q.chartType === 'bar' ? '📊 Create Dashboard' : '📋 Create Table'}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* SPL Search Bar */}
                    <div className="bg-slate-900 border border-slate-700 rounded-xl p-3 flex items-center gap-3">
                      <span className="text-emerald-400 font-mono font-bold text-sm">SPL&gt;</span>
                      <code className="text-xs sm:text-sm text-sky-300 font-mono flex-1 overflow-x-auto">
                        {currentQuery.cmd}
                      </code>
                    </div>
                    <p className="text-xs text-slate-400">{currentQuery.desc}</p>

                    {/* Output Visualization */}
                    {currentQuery.chartType === 'bar' ? (
                      <div className="space-y-3 pt-2">
                        {currentQuery.results.map((r, i) => (
                          <div key={i} className="space-y-1">
                            <div className="flex justify-between text-xs">
                              <span className="font-mono text-slate-200">{r.label}</span>
                              <span className="font-mono text-slate-400">
                                {r.value} eventos ({r.pct}%)
                              </span>
                            </div>
                            <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                              <div
                                className={`h-full ${r.color} rounded-full transition-all duration-500`}
                                style={{ width: `${r.pct}%` }}
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="overflow-x-auto pt-2">
                        <table className="w-full text-left border-collapse text-xs font-mono">
                          <thead>
                            <tr className="border-b border-slate-800 text-sky-400 bg-slate-900/80">
                              {currentQuery.headers.map((h, i) => (
                                <th key={i} className="py-2 px-3">
                                  {h}
                                </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60">
                            {currentQuery.rows.map((row, rIdx) => (
                              <tr key={rIdx} className="hover:bg-slate-900/40">
                                {row.map((cell, cIdx) => (
                                  <td key={cIdx} className="py-2 px-3 text-slate-300">
                                    {cell}
                                  </td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: FLASHCARDS */}
            {activeTab === 'cards' && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-lg font-bold text-white">
                    Flashcards de Repaso Activo
                  </h2>
                  <p className="text-xs text-slate-400">
                    Haz clic en cualquier tarjeta para girar y comprobar la respuesta exacta basada en tus apuntes.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {FLASHCARDS.map((card, idx) => {
                    const isFlipped = !!flippedCards[idx];
                    return (
                      <button
                        key={idx}
                        onClick={() => toggleCard(idx)}
                        className={`text-left p-5 rounded-2xl border transition min-h-[190px] flex flex-col justify-between ${
                          isFlipped
                            ? 'bg-emerald-950/30 border-emerald-500/60'
                            : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center justify-between text-xs font-mono">
                          <span className={isFlipped ? 'text-emerald-400' : 'text-slate-400'}>
                            {isFlipped ? 'RESPUESTA' : `TARJETA #${idx + 1}`}
                          </span>
                          <span className="text-slate-500">Clic para girar ↻</span>
                        </div>

                        <div className="my-3">
                          {isFlipped ? (
                            <p className="text-xs sm:text-sm text-emerald-100 whitespace-pre-line leading-relaxed font-medium">
                              {card.a}
                            </p>
                          ) : (
                            <p className="text-sm font-bold text-white leading-snug">
                              {card.q}
                            </p>
                          )}
                        </div>

                        <div className="text-[11px] text-slate-500">
                          Apuntes Splunk SIEM
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: QUIZ */}
            {activeTab === 'quiz' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-white">
                      Autoevaluación de tus Apuntes
                    </h2>
                    <p className="text-xs text-slate-400">
                      Responde las 5 preguntas clave sobre la hoja de tu cuaderno.
                    </p>
                  </div>
                  <div className="text-right">
                    <div className="text-xs text-slate-400">Puntuación</div>
                    <div className="text-2xl font-bold text-emerald-400">
                      {score} / {QUIZ_QUESTIONS.length}
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  {QUIZ_QUESTIONS.map((q, qIdx) => {
                    const userAns = quizAnswers[qIdx];
                    const answered = userAns !== undefined;
                    return (
                      <div
                        key={qIdx}
                        className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3"
                      >
                        <h3 className="text-sm font-bold text-white">
                          {qIdx + 1}. {q.question}
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {q.options.map((opt, optIdx) => {
                            let btnStyle = 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700';
                            if (answered) {
                              if (optIdx === q.correct) {
                                btnStyle = 'bg-emerald-950/60 border-emerald-500 text-emerald-200 font-semibold';
                              } else if (optIdx === userAns) {
                                btnStyle = 'bg-rose-950/60 border-rose-500 text-rose-200';
                              }
                            }
                            return (
                              <button
                                key={optIdx}
                                onClick={() => handleQuizSelect(qIdx, optIdx)}
                                className={`text-left text-xs p-3 rounded-xl border transition ${btnStyle}`}
                              >
                                {opt}
                              </button>
                            );
                          })}
                        </div>
                        {answered && (
                          <div className="text-xs bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-300">
                            {q.explanation}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* Modal con transcripción exacta del cuaderno */}
          {showNotebookModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-lg">
                    📓 Transcripción Exacta de tu Hoja de Apuntes
                  </h3>
                  <button
                    onClick={() => setShowNotebookModal(false)}
                    className="text-slate-400 hover:text-white text-sm px-2 py-1 rounded bg-slate-800"
                  >
                    Cerrar ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs font-mono text-slate-300">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-emerald-400 font-bold mb-1">ENCABEZADO Y FLUJO SUPERIOR:</div>
                    <p>• Título: Splunk SIEM</p>
                    <p>• Flujo: Network ➔ Logs ➔ Splunk</p>
                    <p>• Pilares: Monitoring | Visibility | Observability</p>
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-emerald-400 font-bold mb-1">COLUMNA 1: FORWARDER</div>
                    <p>• Agent installed</p>
                    <p>• Sending data to Splunk instance</p>
                    <p>• Web Server (web traffic)</p>
                    <p>• Windows Sysmon data (Windows Event, PowerShell)</p>
                    <p>• Linux (Host-centric logs)</p>
                    <p>• Database (DB requests, responses, errors)</p>
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-amber-400 font-bold mb-1">COLUMNA 2: INDEXER (Main Role)</div>
                    <p>• Parses</p>
                    <p>• Normalizes</p>
                    <p>• Categorizes</p>
                    <p>• Store</p>
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-sky-400 font-bold mb-1">COLUMNA 3: SEARCH HEAD</div>
                    <p>• Search and Report App</p>
                    <p>• SPL (Search Processing Language)</p>
                    <p>• Create Dashboard (Gráficos de líneas, circular/pie y barras)</p>
                    <p>• Tables</p>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
