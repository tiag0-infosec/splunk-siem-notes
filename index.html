                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono uppercase px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-500 font-semibold">
                          {t.ui.step1Tag}
                        </span>
                        <span className="text-lg">📡</span>
                      </div>
                      <h3 className={`text-xl font-bold mb-1 ${textHeading}`}>Forwarder</h3>
                      <p className={`text-xs mb-3 ${textMuted}`}>
                        Agent installed ➔ Sending data to Splunk instance
                      </p>
                      <div className="text-xs text-emerald-500 font-semibold">{t.ui.step1Link}</div>
                    </button>

                    <button
                      onClick={() => setSelectedNode('indexer')}
                      className={`text-left p-5 rounded-2xl border transition ${
                        selectedNode === 'indexer'
                          ? 'bg-amber-500/10 border-amber-500 ring-2 ring-amber-500/30'
                          : `${bgCard} hover:border-amber-500/50`
                      }`}
                    >
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono uppercase px-2 py-0.5 rounded bg-amber-500/20 text-amber-500 font-semibold">
                          {t.ui.step2Tag}
                        </span>
                        <span className="text-lg">⚙️</span>
                      </div>
                      <h3 className={`text-xl font-bold mb-1 ${textHeading}`}>Indexer</h3>
                      <p className={`text-xs mb-3 ${textMuted}`}>
                        Parses • Normalizes • Categorizes • Store
                      </p>
                      <div className="text-xs text-amber-500 font-semibold">{t.ui.step2Link}</div>
                    </button>

                    <button
                      onClick={() => setSelectedNode('searchhead')}
                      className={`text-left p-5 rounded-2xl border transition ${
                        selectedNode === 'searchhead'
                          ? 'bg-sky-500/10 border-sky-500 ring-2 ring-sky-500/30'
                          : `${bgCard} hover:border-sky-500/50`
                      }`}
                    >
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono uppercase px-2 py-0.5 rounded bg-sky-500/20 text-sky-500 font-semibold">
                          {t.ui.step3Tag}
                        </span>
                        <span className="text-lg">📊</span>
                      </div>
                      <h3 className={`text-xl font-bold mb-1 ${textHeading}`}>Search Head</h3>
                      <p className={`text-xs mb-3 ${textMuted}`}>
                        Search & Report App • SPL • Dashboards & Tables
                      </p>
                      <div className="text-xs text-sky-500 font-semibold">{t.ui.step3Link}</div>
                    </button>
                  </div>

                  <div className={`border rounded-2xl p-6 shadow-xl ${bgCard}`}>
                    {selectedNode === 'forwarder' && (
                      <div className="space-y-6">
                        <div className={`border-b pb-4 ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                          <span className="text-xs font-mono text-emerald-500 uppercase font-semibold">
                            {t.ui.comp1Tag}
                          </span>
                          <h3 className={`text-2xl font-bold mt-1 ${textHeading}`}>
                            {t.arch.forwarder.title}
                          </h3>
                          <div className="mt-3 flex flex-wrap gap-2">
                            {t.arch.forwarder.notebookNotes.map((note, i) => (
                              <span
                                key={i}
                                className="text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 px-3 py-1 rounded-lg font-mono"
                              >
                                ✏️ "{note}"
                              </span>
                            ))}
                          </div>
                        </div>

                        <div>
                          <h4 className={`text-sm font-semibold mb-3 ${textHeading}`}>
                            {t.ui.sourcesTitle}
                          </h4>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {t.arch.forwarder.sources.map((src, idx) => (
                              <div key={idx} className={`border rounded-xl p-4 space-y-2 ${bgSubCard}`}>
                                <div className="flex items-center justify-between">
                                  <span className="font-bold text-emerald-500 text-sm">
                                    • {src.name}{' '}
                                    <span className={`font-normal ${textMuted}`}>{src.detail}</span>
                                  </span>
                                </div>
                                <p className={`text-xs ${textMuted}`}>{src.explanation}</p>
                                <div className="bg-slate-900 text-slate-200 p-2.5 rounded-lg border border-slate-800 font-mono text-[11px] overflow-x-auto">
                                  {src.example}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {selectedNode === 'indexer' && (
                      <div className="space-y-6">
                        <div className={`border-b pb-4 ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                          <span className="text-xs font-mono text-amber-500 uppercase font-semibold">
                            {t.ui.comp2Tag}
                          </span>
                          <h3 className={`text-2xl font-bold mt-1 ${textHeading}`}>
                            {t.arch.indexer.title}
                          </h3>
                          <p className={`text-xs mt-1 ${textMuted}`}>{t.ui.comp2Desc}</p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                          {t.arch.indexer.steps.map((item, idx) => (
                            <div key={idx} className={`border border-amber-500/30 rounded-xl p-4 flex flex-col justify-between ${bgSubCard}`}>
                              <div>
                                <div className="text-xs font-mono text-amber-500 font-semibold mb-1">
                                  {t.ui.phase} 0{idx + 1}
                                </div>
                                <h4 className={`text-lg font-bold mb-2 ${textHeading}`}>• {item.step}</h4>
                                <p className={`text-xs leading-relaxed ${textMuted}`}>{item.desc}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {selectedNode === 'searchhead' && (
                      <div className="space-y-6">
                        <div className={`border-b pb-4 ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                          <span className="text-xs font-mono text-sky-500 uppercase font-semibold">
                            {t.ui.comp3Tag}
                          </span>
                          <h3 className={`text-2xl font-bold mt-1 ${textHeading}`}>
                            {t.arch.searchhead.title}
                          </h3>
                          <p className={`text-xs mt-1 ${textMuted}`}>{t.ui.comp3Desc}</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {t.arch.searchhead.capabilities.map((cap, idx) => (
                            <div key={idx} className={`border border-sky-500/30 rounded-xl p-4 ${bgSubCard}`}>
                              <h4 className="text-base font-bold text-sky-500 mb-1">• {cap.name}</h4>
                              <p className={`text-xs leading-relaxed ${textMuted}`}>{cap.desc}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </section>
              </div>
            )}

            {activeTab === 'sim' && (
              <div className="space-y-6">
                <div className={`border rounded-2xl p-6 ${bgCard}`}>
                  <h2 className={`text-lg font-bold mb-1 ${textHeading}`}>{t.ui.simTitle}</h2>
                  <p className={`text-xs mb-4 ${textMuted}`}>{t.ui.simSubtitle}</p>

                  <div className="flex flex-wrap gap-2 mb-6">
                    {Object.entries(SIMULATOR_BASE).map(([key, item]) => (
                      <button
                        key={key}
                        onClick={() => {
                          setSimSource(key);
                          setSimQueryIdx(0);
                        }}
                        className={`px-3.5 py-2 rounded-xl text-xs font-semibold transition border ${
                          simSource === key
                            ? 'bg-emerald-500 text-slate-950 border-emerald-400'
                            : `${bgSubCard} ${textMuted} hover:border-emerald-500/40`
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
                    <div className={`border border-emerald-500/30 rounded-xl p-4 ${bgSubCard}`}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono font-semibold text-emerald-500">
                          1. FORWARDER (Sending raw data)
                        </span>
                        <span className={`text-[11px] font-mono ${textMuted}`}>
                          sourcetype={currentSim.sourcetype}
                        </span>
                      </div>
                      <pre className="text-xs font-mono text-slate-200 bg-slate-900 p-3 rounded-lg border border-slate-800 whitespace-pre-wrap break-all">
                        {currentSim.rawLog}
                      </pre>
                    </div>

                    <div className={`border border-amber-500/30 rounded-xl p-4 ${bgSubCard}`}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono font-semibold text-amber-500">
                          2. INDEXER (Parses, Normalizes, Categorizes, Store)
                        </span>
                        <span className={`text-[11px] font-mono ${textMuted}`}>
                          index={currentSim.index}
                        </span>
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        {Object.entries(currentSim.parsed).map(([k, v]) => (
                          <div key={k} className="bg-slate-900 px-2.5 py-1.5 rounded border border-slate-800">
                            <span className="text-slate-400 font-mono">{k}: </span>
                            <span className="text-amber-300 font-mono font-medium">{v}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className={`border border-sky-500/30 rounded-xl p-5 space-y-4 ${bgSubCard}`}>
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="text-xs font-mono font-semibold text-sky-500">
                        3. SEARCH HEAD • Search and Report App (SPL)
                      </span>
                      <div className="flex gap-2">
                        {currentSim.splQueries.map((q, idx) => (
                          <button
                            key={idx}
                            onClick={() => setSimQueryIdx(idx)}
                            className={`text-xs px-3 py-1 rounded-lg border transition ${
                              simQueryIdx === idx
                                ? 'bg-sky-500 text-slate-950 font-semibold border-sky-400'
                                : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {q.chartType === 'bar' ? t.ui.btnDashboard : t.ui.btnTable}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-700 rounded-xl p-3 flex items-center gap-3">
                      <span className="text-emerald-400 font-mono font-bold text-sm">SPL&gt;</span>
                      <code className="text-xs sm:text-sm text-sky-300 font-mono flex-1 overflow-x-auto">
                        {currentQuery.cmd}
                      </code>
                    </div>
                    <p className={`text-xs ${textMuted}`}>{currentQueryDesc}</p>

                    {currentQuery.chartType === 'bar' ? (
                      <div className="space-y-3 pt-2">
                        {currentQuery.results.map((r, i) => (
                          <div key={i} className="space-y-1">
                            <div className="flex justify-between text-xs">
                              <span className={`font-mono font-medium ${textHeading}`}>{r.label}</span>
                              <span className={`font-mono ${textMuted}`}>
                                {r.value} {t.ui.eventsLabel} ({r.pct}%)
                              </span>
                            </div>
                            <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                              <div
                                className={`h-full ${r.color} rounded-full transition-all duration-500`}
                                style={{ width: `${r.pct}%` }}
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="overflow-x-auto pt-2">
                        <table className="w-full text-left border-collapse text-xs font-mono">
                          <thead>
                            <tr className="border-b border-slate-800 text-sky-400 bg-slate-900">
                              {currentQuery.headers.map((h, i) => (
                                <th key={i} className="py-2 px-3">{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 bg-slate-950 text-slate-200">
                            {currentQuery.rows.map((row, rIdx) => (
                              <tr key={rIdx} className="hover:bg-slate-900/60">
                                {row.map((cell, cIdx) => (
                                  <td key={cIdx} className="py-2 px-3">{cell}</td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'cards' && (
              <div className="space-y-4">
                <div>
                  <h2 className={`text-lg font-bold ${textHeading}`}>{t.ui.cardsTitle}</h2>
                  <p className={`text-xs ${textMuted}`}>{t.ui.cardsSubtitle}</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {t.flashcards.map((card, idx) => {
                    const isFlipped = !!flippedCards[idx];
                    return (
                      <button
                        key={idx}
                        onClick={() => toggleCard(idx)}
                        className={`text-left p-5 rounded-2xl border transition min-h-[190px] flex flex-col justify-between ${
                          isFlipped
                            ? 'bg-emerald-500/10 border-emerald-500/60'
                            : `${bgCard} hover:border-emerald-500/40`
                        }`}
                      >
                        <div className="flex items-center justify-between text-xs font-mono">
                          <span className={isFlipped ? 'text-emerald-500 font-bold' : textMuted}>
                            {isFlipped ? t.ui.cardBack : `${t.ui.cardFront} #${idx + 1}`}
                          </span>
                          <span className={textMuted}>{t.ui.cardFlip}</span>
                        </div>

                        <div className="my-3">
                          {isFlipped ? (
                            <p className={`text-xs sm:text-sm whitespace-pre-line leading-relaxed font-medium ${textHeading}`}>
                              {card.a}
                            </p>
                          ) : (
                            <p className={`text-sm font-bold leading-snug ${textHeading}`}>
                              {card.q}
                            </p>
                          )}
                        </div>

                        <div className={`text-[11px] ${textMuted}`}>{t.ui.cardFooter}</div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'quiz' && (
              <div className="space-y-6">
                <div className={`border rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4 ${bgCard}`}>
                  <div>
                    <h2 className={`text-lg font-bold ${textHeading}`}>{t.ui.quizTitle}</h2>
                    <p className={`text-xs ${textMuted}`}>{t.ui.quizSubtitle}</p>
                  </div>
                  <div className="flex items-center gap-4">
                    <button
                      onClick={() => setQuizAnswers({})}
                      className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition"
                    >
                      {t.ui.resetQuiz}
                    </button>
                    <div className="text-right">
                      <div className={`text-xs ${textMuted}`}>{t.ui.scoreLabel}</div>
                      <div className="text-2xl font-bold text-emerald-500">
                        {score} / {t.quiz.length}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  {t.quiz.map((q, qIdx) => {
                    const userAns = quizAnswers[qIdx];
                    const answered = userAns !== undefined;
                    return (
                      <div key={qIdx} className={`border rounded-2xl p-5 space-y-3 ${bgCard}`}>
                        <h3 className={`text-sm font-bold ${textHeading}`}>
                          {qIdx + 1}. {q.question}
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {q.options.map((opt, optIdx) => {
                            let btnStyle = `${bgSubCard} ${textMuted} hover:border-emerald-500/40`;
                            if (answered) {
                              if (optIdx === q.correct) {
                                btnStyle = 'bg-emerald-500/20 border-emerald-500 text-emerald-400 font-semibold';
                              } else if (optIdx === userAns) {
                                btnStyle = 'bg-rose-500/20 border-rose-500 text-rose-400';
                              }
                            }
                            return (
                              <button
                                key={optIdx}
                                onClick={() => handleQuizSelect(qIdx, optIdx)}
                                className={`text-left text-xs p-3 rounded-xl border transition ${btnStyle}`}
                              >
                                {opt}
                              </button>
                            );
                          })}
                        </div>
                        {answered && (
                          <div className={`text-xs border p-3 rounded-xl ${bgSubCard} ${textHeading}`}>
                            {q.explanation}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {showNotebookModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto text-slate-100">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-lg">📓 {t.ui.modalTitle}</h3>
                  <button
                    onClick={() => setShowNotebookModal(false)}
                    className="text-slate-400 hover:text-white text-sm px-2 py-1 rounded bg-slate-800"
                  >
                    {t.ui.close} ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs font-mono text-slate-300">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-emerald-400 font-bold mb-1">HEADER & TOP FLOW:</div>
                    <p>• Title: Splunk SIEM</p>
                    <p>• Flow: Network ➔ Logs ➔ Splunk</p>
                    <p>• Pillars: Monitoring | Visibility | Observability</p>
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-emerald-400 font-bold mb-1">COLUMN 1: FORWARDER</div>
                    <p>• Agent installed</p>
                    <p>• Sending data to Splunk instance</p>
                    <p>• Web Server (web traffic)</p>
                    <p>• Windows Sysmon data (Windows Event, PowerShell)</p>
                    <p>• Linux (Host-centric logs)</p>
                    <p>• Database (DB requests, responses, errors)</p>
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-amber-400 font-bold mb-1">COLUMN 2: INDEXER (Main Role)</div>
                    <p>• Parses</p>
                    <p>• Normalizes</p>
                    <p>• Categorizes</p>
                    <p>• Store</p>
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-sky-400 font-bold mb-1">COLUMN 3: SEARCH HEAD</div>
                    <p>• Search and Report App</p>
                    <p>• SPL (Search Processing Language)</p>
                    <p>• Create Dashboard (Line, Pie & Bar charts)</p>
                    <p>• Tables</p>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
